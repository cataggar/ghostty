name: Input Quiescence

on:
  pull_request:
    branches: [android]
    paths:
      - "src/termio/**"
      - "src/apprt/**"
      - "src/Surface.zig"
      - "src/termio.zig"
      - "src/apprt.zig"
      - "include/ghostty.h"
      - "build.zig*"
      - "src/build/**"
      - "nix/**"
      - "flake.*"
      - ".github/workflows/input-quiescence.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: input-quiescence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: github.repository == 'cataggar/ghostty'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Use the public dependency cache
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: ghostty
          skipPush: true

      - name: Exercise Linux PTY input and shutdown
        run: >-
          nix develop --no-write-lock-file -c
          zig build test -Dapp-runtime=none
          -Dtest-filter="input quiescence"
          -Dtest-filter=queueIo -Dtest-filter=termio
          -Demit-macos-app=false -Demit-lib-vt=false
          --summary all
